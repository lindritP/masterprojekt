name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    # Both architectures: the corpus test is the FR-410/FR-043 determinism check.
    name: checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.work
          cache-dependency-path: "**/go.sum"
      - run: make ci

  conformance:
    # Port conformance suite against the local stack (SRS §7.4, AR-011–AR-013).
    name: port conformance (local stack)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.work
          cache-dependency-path: "**/go.sum"
      - run: make stack-up
      - run: make test-conformance
      - name: Publish results (AR-013)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: conformance-local
          path: build/conformance-local.json
      - if: always()
        run: make stack-down

  e2e:
    # The whole V1 application on the local stack, through the public API (SRS §10.2).
    name: E2E (local stack, V1)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.work
          cache-dependency-path: "**/go.sum"
      - run: make dev
      - run: make test-e2e
      - name: Service logs
        if: failure()
        run: docker compose -f deploy/local/docker-compose.yaml --profile app logs --no-color identity-gateway case-service intake-service validation-worker
      - if: always()
        run: make stack-down

  demo-ui:
    # Presentation UI (ADR 0014): only type-checked and built, never deployed.
    name: demo UI build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: demo/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: demo/web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build
