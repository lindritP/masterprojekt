name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: format, vet, test, boundaries, register
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.work
          cache-dependency-path: "**/go.sum"
      - run: make ci

  local-stack:
    name: local stack config
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Validate docker compose file (DR-012)
        run: docker compose -f deploy/local/docker-compose.yaml config --quiet
