# Local development stack — SRS §9.5 (DR-012, DR-014).
#
# Exactly the V1 portable adapter set: PostgreSQL, an S3-compatible store,
# an AMQP 1.0 broker and an OIDC identity provider. No cloud account needed.
# Every credential here is a local-only test value (DR-008); none is used on
# any deployed target.
#
#   make stack-up     start and wait until healthy
#   make stack-down   stop, keep data
#   make stack-reset  stop and delete data
#
# Host ports: 5432 PostgreSQL · 8333 S3 · 5672/15672 RabbitMQ · 8180 Keycloak;
# with `make dev` also 8080 identity-gateway (public API) · 8090 API explorer.

name: ccsra

x-v1-common: &v1-common
  CCSRA_VARIANT: v1
  CCSRA_TARGET: local
  CCSRA_LOG_LEVEL: info
  CCSRA_ADAPTER_SECRETS: k8s

x-broker: &broker
  CCSRA_ADAPTER_BROKER: amqp
  CCSRA_BROKER_URL: amqp://rabbitmq:5672
  CCSRA_BROKER_USER: ccsra
  CCSRA_BROKER_PASSWORD: ccsra-local
  CCSRA_BROKER_VHOST: ccsra

x-app-health: &app-health
  # Distroless has no shell: each binary probes its own /healthz.
  test: ["CMD", "/app", "-healthcheck"]
  interval: 2s
  timeout: 3s
  retries: 30

services:
  postgres:
    image: postgres:16.15
    environment:
      POSTGRES_DB: ccsra
      POSTGRES_USER: ccsra
      POSTGRES_PASSWORD: ccsra-local
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ccsra -d ccsra"]
      interval: 2s
      timeout: 3s
      retries: 30

  # One-shot: apply db/migrations (FR-213, ADR 0011). On Kubernetes the same
  # image runs as an init step before case-service.
  db-migrate:
    image: migrate/migrate:v4.20.1
    depends_on:
      postgres: { condition: service_healthy }
    volumes:
      - ../../db/migrations:/migrations:ro
    command: ["-path=/migrations", "-database=postgres://ccsra:ccsra-local@postgres:5432/ccsra?sslmode=disable", "up"]
    restart: "no"

  # S3-compatible store (ADR 0009). Credentials in seaweedfs/s3.json.
  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    command: server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
    ports: ["8333:8333"]
    volumes:
      - s3data:/data
      - ./seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8333/healthz"]
      interval: 2s
      timeout: 3s
      retries: 60

  # One-shot: create the document bucket with Object Lock enabled (FR-309).
  s3-init:
    image: amazon/aws-cli:2.38.6
    depends_on:
      seaweedfs: { condition: service_healthy }
    environment:
      AWS_ACCESS_KEY_ID: ccsra-local
      AWS_SECRET_ACCESS_KEY: ccsra-local-secret
      AWS_DEFAULT_REGION: eu-central-1
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        aws --endpoint-url http://seaweedfs:8333 s3api head-bucket --bucket ccsra-documents 2>/dev/null
        || aws --endpoint-url http://seaweedfs:8333 s3api create-bucket
        --bucket ccsra-documents --object-lock-enabled-for-bucket
    restart: "no"

  # AMQP 1.0 broker. User, vhost, exchanges and queues: rabbitmq/definitions.json.
  rabbitmq:
    image: rabbitmq:4.3.7-management-alpine
    ports: ["5672:5672", "15672:15672"]
    volumes:
      - mqdata:/var/lib/rabbitmq
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/conf.d/20-ccsra.conf:ro
      - ./rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 10s
      retries: 30

  # OIDC provider. Realm, roles, clients and test users: keycloak/ccsra-realm.json.
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.5
    command: start-dev --import-realm --http-port=8180
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin-local
      KC_HEALTH_ENABLED: "true"
      # Fixed issuer, so tokens fetched from the host and from containers match.
      KC_HOSTNAME: http://localhost:8180
    ports: ["8180:8180"]
    volumes:
      - ./keycloak/ccsra-realm.json:/opt/keycloak/data/import/ccsra-realm.json:ro
    healthcheck:
      # The image has no curl or wget; use bash's /dev/tcp against the management port.
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"UP"' <&3
      interval: 5s
      timeout: 5s
      retries: 60

  # ---------------------------------------------------------------- the application
  # `make dev` starts these (profile "app") after the stack above. Images are
  # built from app/v1 (one Dockerfile, SERVICE build arg). Only the gateway and
  # the API explorer are published; the internal APIs stay on the compose
  # network, like a cluster-internal service (SRS §5.1).

  case-service:
    profiles: ["app"]
    image: ccsra/v1-case-service:dev
    build: { context: ../../app/v1, args: { SERVICE: case-service, VERSION: "${CCSRA_VERSION:-dev}" } }
    environment:
      <<: [*v1-common, *broker]
      CCSRA_ADAPTER_REPOSITORY: pg
      CCSRA_DB_HOST: postgres
      CCSRA_DB_NAME: ccsra
      CCSRA_DB_USER: ccsra_app
      CCSRA_DB_PASSWORD: ccsra-app-local
      CCSRA_DB_SSLMODE: disable
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    healthcheck: *app-health

  intake-service:
    profiles: ["app"]
    image: ccsra/v1-intake-service:dev
    build: { context: ../../app/v1, args: { SERVICE: intake-service, VERSION: "${CCSRA_VERSION:-dev}" } }
    environment:
      <<: [*v1-common, *broker]
      CCSRA_ADAPTER_STORAGE: s3
      CCSRA_STORAGE_ENDPOINT: http://seaweedfs:8333
      # Presigned URLs for clients on the host must name a host they can reach.
      CCSRA_STORAGE_PUBLIC_ENDPOINT: http://localhost:8333
      CCSRA_STORAGE_REGION: eu-central-1
      CCSRA_STORAGE_BUCKET: ccsra-documents
      CCSRA_STORAGE_ACCESS_KEY: ccsra-local
      CCSRA_STORAGE_SECRET_KEY: ccsra-local-secret
      CCSRA_STORAGE_PATH_STYLE: "true"
      CCSRA_CASE_SERVICE_URL: http://case-service:8080
    depends_on:
      seaweedfs: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      case-service: { condition: service_healthy }
    healthcheck: *app-health

  validation-worker:
    profiles: ["app"]
    image: ccsra/v1-validation-worker:dev
    build: { context: ../../app/v1, args: { SERVICE: validation-worker, VERSION: "${CCSRA_VERSION:-dev}" } }
    environment:
      <<: [*v1-common, *broker]
      CCSRA_SUBSCRIPTION: ccsra.validation
      CCSRA_INTAKE_SERVICE_URL: http://intake-service:8080
      CCSRA_CASE_SERVICE_URL: http://case-service:8080
    depends_on:
      rabbitmq: { condition: service_healthy }
      intake-service: { condition: service_healthy }
      case-service: { condition: service_healthy }
    healthcheck: *app-health

  identity-gateway:
    profiles: ["app"]
    image: ccsra/v1-identity-gateway:dev
    build: { context: ../../app/v1, args: { SERVICE: identity-gateway, VERSION: "${CCSRA_VERSION:-dev}" } }
    environment:
      <<: *v1-common
      CCSRA_ADAPTER_IDENTITY: oidc
      CCSRA_OIDC_ISSUER: http://localhost:8180/realms/ccsra
      CCSRA_OIDC_AUDIENCE: ccsra-api
      CCSRA_OIDC_JWKS_URL: http://keycloak:8180/realms/ccsra/protocol/openid-connect/certs
      CCSRA_CASE_SERVICE_URL: http://case-service:8080
      CCSRA_INTAKE_SERVICE_URL: http://intake-service:8080
      CCSRA_CORS_ALLOWED_ORIGINS: http://localhost:8090
    ports: ["8080:8080"]
    depends_on:
      keycloak: { condition: service_healthy }
      case-service: { condition: service_healthy }
      intake-service: { condition: service_healthy }
    healthcheck: *app-health

  # Interactive API explorer for api/openapi.yaml; log in through Keycloak
  # (client ccsra-web, authorization code + PKCE).
  swagger-ui:
    profiles: ["app"]
    image: swaggerapi/swagger-ui:v5.33.3
    environment:
      SWAGGER_JSON: /api/openapi.yaml
      OAUTH_CLIENT_ID: ccsra-web
      OAUTH_USE_PKCE: "true"
      OAUTH_SCOPES: openid
    volumes:
      - ../../api:/api:ro
    ports: ["8090:8080"]

volumes:
  pgdata:
  s3data:
  mqdata:
