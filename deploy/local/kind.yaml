# Local Kubernetes cluster for exercising the Helm charts before any cloud
# deployment (SRS DR-015). Used from stage B4.
#
#   kind create cluster --config deploy/local/kind.yaml
#
# Host port 8088 reaches the cluster ingress on port 80.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: ccsra
nodes:
  - role: control-plane
    labels:
      ingress-ready: "true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 8088
        protocol: TCP
  - role: worker
